<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglercraft | Ultimate Launcher</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte Pixelada e Moderna -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Fundo Animado com Cubos Ambientais -->
    <div class="bg-animation" id="bgAnimation"></div>

    <!-- Tela Inicial (Launcher) -->
    <main class="launcher-container" id="launcherScreen">
        <header class="logo-area">
            <h1 class="game-title">EAGLERCRAFT</h1>
            <p class="game-subtitle">Minecraft 1.8.8 direto no seu Navegador</p>
        </header>

        <section class="card-preview">
            <div class="cube-wrapper">
                <div class="cube">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
            <button class="play-btn" id="btnPlay">
                <span class="btn-text">JOGAR AGORA</span>
                <span class="btn-icon">▶</span>
            </button>
        </section>

        <footer class="launcher-footer">
            <p>Servidores Multiplayer Prontos • Desempenho Otimizado</p>
        </footer>
    </main>

    <!-- Tela do Jogo (Oculta até clicar em Jogar) -->
    <div class="game-screen hidden" id="gameScreen">
        <div class="game-bar">
            <span class="bar-title">Eaglercraft Ativo</span>
            <div class="bar-controls">
                <button class="control-btn" id="btnFullscreen" title="Tela Cheia">⛶</button>
                <button class="control-btn close-btn" id="btnClose" title="Sair do Jogo">✕</button>
            </div>
        </div>
        <div class="iframe-container" id="gameContainer">
            <!-- O iframe será injetado dinamicamente via JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
